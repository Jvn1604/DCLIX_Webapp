      <use href="#petal" transform="rotate(180) translate(0 -70)"/><use href="#petal" transform="rotate(225) translate(0 -70)"/><use href="#petal" transform="rotate(270) translate(0 -70)"/><use href="#petal" transform="rotate(315) translate(0 -70)"/>
